name: Futures Data Worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run scanner
        id: scan
        continue-on-error: true
        run: python scanner.py

      - name: Commit market output
        run: |
          git config user.name "futures-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/scan.json public/health.json
          git diff --cached --quiet || git commit -m "data: update futures scan"
          git push

      - name: Fail if data gate is RED
        if: steps.scan.outcome == 'failure'
        run: exit 1
